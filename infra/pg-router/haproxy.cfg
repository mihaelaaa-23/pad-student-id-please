# pg-router: one fixed address per PostgreSQL cluster (Lab 5, grade 5).
#
# Every cluster runs three Spilo (Patroni) nodes. Patroni's REST API on 8008 answers
# GET /primary with 200 only on the current leader and GET /replica with 200 only on
# a healthy replica, so HAProxy health-checks that port and sends each connection to
# the right node. Services keep one DB_HOST/DB_PORT and need no code change; after a
# failover the old leader fails /primary within ~4 s (inter 2s, fall 2) and its
# connections are cut (on-marked-down shutdown-sessions), so clients reconnect to the
# new leader.
#
#   540x  read-write, the leader:  5401 player, 5402 session, 5406 university-record, 5407 moderation
#   550x  read-only, the replicas: 5501, 5502, 5506, 5507 (the ETL reads here)
#   8404  stats page
#
# Servers of clusters that don't exist yet stay listed: with init-addr none an
# unresolvable name starts DOWN instead of stopping HAProxy, and the Docker resolver
# picks the container up (and any new IP after a recreate) as soon as it exists.

global
    log stdout format raw local0 info
    maxconn 2000

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 5s
    hold obsolete 5s

defaults
    mode tcp
    log global
    option tcplog
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 2s
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none

listen stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s

# ---------- player-db (Mihaela's Player Service) ----------
listen player-db-leader
    bind :5401
    option httpchk GET /primary
    http-check expect status 200
    server player-db-1 player-db-1:5432 check port 8008
    server player-db-2 player-db-2:5432 check port 8008
    server player-db-3 player-db-3:5432 check port 8008

listen player-db-replicas
    bind :5501
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server player-db-1 player-db-1:5432 check port 8008
    server player-db-2 player-db-2:5432 check port 8008
    server player-db-3 player-db-3:5432 check port 8008

