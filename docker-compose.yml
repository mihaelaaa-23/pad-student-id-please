      RS_MEMBERS: rules-db-1:27017,rules-db-2:27017,rules-db-3:27017
      MONGO_ROOT_USERNAME: ${RULES_DB_USER}
      MONGO_ROOT_PASSWORD: ${RULES_DB_PASSWORD}
    volumes:
