      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 60s

  rules-db-2:
    <<: *rules-db
    hostname: rules-db-2
    environment:
      SERVICE_NAME: rules-db-2
      RS_NAME: rs-rules
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
      MONGO_WT_CACHE_GB: "0.25"
    volumes:
      - rules_db_2_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro

  rules-db-3:
    <<: *rules-db
    hostname: rules-db-3
    environment:
      SERVICE_NAME: rules-db-3
      RS_NAME: rs-rules
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
