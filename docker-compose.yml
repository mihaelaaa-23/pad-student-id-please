services:
  # ==================== Gateway (Mihaela) ====================
  # The single entry point. No depends_on: the Gateway starts independently and
  # answers 502 BAD_GATEWAY until a service is up.
  gateway:
    image: mihaela5/gateway:2.0.0-rc.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PLAYER_SERVICE_URL: http://player-service:3001
      SESSION_SERVICE_URL: http://session-service:3002
      APPLICANT_SERVICE_URL: http://applicant-service:3003
      CREDENTIAL_SERVICE_URL: http://credential-service:3004
      RULES_SERVICE_URL: http://server-rules-service:3005
      UNIVERSITY_RECORD_SERVICE_URL: http://university-record-service:3006
      MODERATION_SERVICE_URL: http://moderation-service:3007
      # Discord DMs serves REST on 3009; 3008 is the WebSocket listener alone, so
      # forwarding there would answer 404 for every REST call.
      DISCORD_DMS_SERVICE_URL: http://discord-dms-service:3009
      UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-10000}

  # ==================== Player Service (Mihaela) ====================
  player-service:
    image: mihaela5/player-service:2.0.0-rc.2
    restart: unless-stopped
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/player.
    environment:
      PORT: 3001
      DB_HOST: player-db
      DB_PORT: 5432
      DB_USER: ${PLAYER_DB_USER}
      DB_PASSWORD: ${PLAYER_DB_PASSWORD}
      DB_NAME: ${PLAYER_DB_NAME}
      # Lab 2, grade 8: task timeout (504 TASK_TIMEOUT) and concurrent task limit
      # (503 CONCURRENCY_LIMIT_REACHED). A leaf in the timeout budget: 2000, below the
      # 4500 Session waits for it.
      TASK_TIMEOUT_MS: ${PLAYER_TASK_TIMEOUT_MS:-2000}
      MAX_CONCURRENT_TASKS: ${PLAYER_MAX_CONCURRENT_TASKS:-50}
      # Lab 2, grade 10: signs the login token (JWT, HS256). Required, at least 32
      # characters; the service does not start without it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, see .env.example}
    depends_on:
      player-db:
        condition: service_healthy

  player-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAYER_DB_USER}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD}
      POSTGRES_DB: ${PLAYER_DB_NAME}
    volumes:
      - player_db_data:/var/lib/postgresql/data
      - ./db/player-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_DB_USER} -d ${PLAYER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Server Moderation Session Service (Mihaela) ====================
  session-service:
    image: mihaela5/session-service:2.0.0-rc.3
    restart: unless-stopped
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/session.
    environment:
      PORT: 3002
      DB_HOST: session-db
      DB_PORT: 5432
      DB_USER: ${SESSION_DB_USER}
      DB_PASSWORD: ${SESSION_DB_PASSWORD}
      DB_NAME: ${SESSION_DB_NAME}
      # Through the Gateway, like every service-to-service call (Lab 2, grade 6).
      PLAYER_SERVICE_URL: http://gateway:3000/player
      APPLICANT_SERVICE_URL: http://gateway:3000/applicant
      CREDENTIAL_SERVICE_URL: http://gateway:3000/credential
      RULES_SERVICE_URL: http://gateway:3000/server-rules
      UNIVERSITY_RECORD_SERVICE_URL: http://gateway:3000/university-record
      # Lab 2, grade 8: task timeout (504 TASK_TIMEOUT) and concurrent task limit
      # (503 CONCURRENCY_LIMIT_REACHED). Timeout budget (README, Gateway notes): 4500 per
      # outgoing call > every callee's TASK_TIMEOUT_MS; own cap 8000 < the Gateway's 10000.
      HTTP_TIMEOUT_MS: ${SESSION_HTTP_TIMEOUT_MS:-4500}
      TASK_TIMEOUT_MS: ${SESSION_TASK_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_TASKS: ${SESSION_MAX_CONCURRENT_TASKS:-50}
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call.
      # Empty by default, so nothing changes until authorization is turned on.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    depends_on:
      session-db:
        condition: service_healthy

  session-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SESSION_DB_USER}
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD}
      POSTGRES_DB: ${SESSION_DB_NAME}
    volumes:
      - session_db_data:/var/lib/postgresql/data
      - ./db/session-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESSION_DB_USER} -d ${SESSION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Applicant Service (Ciprian) ====================
  applicant-service:
    image: ciprik13/applicant-service:2.0.0-rc.4
    restart: unless-stopped
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/applicant.
    environment:
      PORT: 3003
      STORE_DRIVER: mongo
      DECEPTIVE_RATE: ${APPLICANT_DECEPTIVE_RATE:-0.35}
      DB_HOST: applicant-db
      DB_PORT: 27017
      DB_USER: ${APPLICANT_DB_USER}
      DB_PASSWORD: ${APPLICANT_DB_PASSWORD}
      DB_NAME: ${APPLICANT_DB_NAME}
      # Through the Gateway, like every service-to-service call (Lab 2, grade 6).
      UNIVERSITY_RECORD_SERVICE_URL: http://gateway:3000/university-record
      # Lab 2, grade 8: per-request task timeout (504 TASK_TIMEOUT) and concurrent
      # task limit (503 CONCURRENCY_LIMIT_REACHED). Test hooks stay off unless a
      # demo of the 503/504 turns them on through .env.
      # Timeout budget (README, Gateway notes): outgoing 2500 > University Record's 2000,
      # own task 3000 > outgoing 2500, and below Credential's 3500 for this service.
      HTTP_TIMEOUT_MS: ${APPLICANT_HTTP_TIMEOUT_MS:-2500}
      TASK_TIMEOUT_MS: ${APPLICANT_TASK_TIMEOUT_MS:-3000}
      MAX_CONCURRENT_TASKS: ${APPLICANT_MAX_CONCURRENT_TASKS:-50}
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call.
      # Empty by default, so nothing changes until authorization is turned on.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      ENABLE_TEST_HOOKS: ${ENABLE_TEST_HOOKS:-false}
    depends_on:
      applicant-db:
        condition: service_healthy

  applicant-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${APPLICANT_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${APPLICANT_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${APPLICANT_DB_NAME}
    volumes:
      - applicant_db_data:/data/db
      - ./db/applicant-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Credential Service (Ciprian) ====================
  credential-service:
    image: ciprik13/credential-service:2.0.0-rc.4
    restart: unless-stopped
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/credential.
    environment:
      PORT: 3004
      STORE_DRIVER: mongo
      CREDENTIAL_SIGNING_SECRET: ${CREDENTIAL_SIGNING_SECRET}
      # Through the Gateway, like every service-to-service call (Lab 2, grade 6).
      # Unset would mean the client answers from its mock even though the real
      # service is running here.
      APPLICANT_SERVICE_URL: http://gateway:3000/applicant
      DB_HOST: credential-db
      DB_PORT: 27017
      DB_USER: ${CREDENTIAL_DB_USER}
      DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
      DB_NAME: ${CREDENTIAL_DB_NAME}
      # Lab 2, grade 8: per-request task timeout (504 TASK_TIMEOUT) and concurrent
      # task limit (503 CONCURRENCY_LIMIT_REACHED). Test hooks stay off unless a
      # demo of the 503/504 turns them on through .env.
      # Timeout budget (README, Gateway notes): outgoing 3500 > Applicant's 3000,
      # own task 4000 > outgoing 3500, and below Session's 4500 for this service.
      HTTP_TIMEOUT_MS: ${CREDENTIAL_HTTP_TIMEOUT_MS:-3500}
      TASK_TIMEOUT_MS: ${CREDENTIAL_TASK_TIMEOUT_MS:-4000}
      MAX_CONCURRENT_TASKS: ${CREDENTIAL_MAX_CONCURRENT_TASKS:-50}
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call.
      # Empty by default, so nothing changes until authorization is turned on.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      ENABLE_TEST_HOOKS: ${ENABLE_TEST_HOOKS:-false}
    depends_on:
      credential-db:
        condition: service_healthy

  credential-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CREDENTIAL_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${CREDENTIAL_DB_NAME}
    volumes:
      - credential_db_data:/data/db
      - ./db/credential-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Server Rules Service (Ion) ====================
  server-rules-service:
    image: ion190/server-rules-service:2.0.0-rc.4
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: rules-db
      DB_PORT: 27017
      DB_USER: ${RULES_DB_USER}
      DB_PASSWORD: ${RULES_DB_PASSWORD}
      DB_NAME: ${RULES_DB_NAME}
      UNIVERSITY_RECORD_SERVICE_URL: http://gateway:3000/university-record
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      TASK_TIMEOUT_MS: ${RULES_TASK_TIMEOUT_MS:-3000}
      MAX_CONCURRENT_TASKS: ${RULES_MAX_CONCURRENT_TASKS:-50}
    depends_on:
      rules-db:
        condition: service_healthy

  rules-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RULES_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${RULES_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${RULES_DB_NAME}
    volumes:
      - rules_db_data:/data/db
      - ./db/server-rules-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== University Record Service (Ion) ====================
  university-record-service:
    image: ion190/university-record-service:2.0.0-rc.4
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DB_HOST: university-record-db
      DB_PORT: 5432
      DB_USER: ${UNIVERSITY_RECORD_DB_USER}
      DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
      DB_NAME: ${UNIVERSITY_RECORD_DB_NAME}
      TASK_TIMEOUT_MS: ${UNIVERSITY_RECORD_TASK_TIMEOUT_MS:-2000}
      MAX_CONCURRENT_TASKS: ${UNIVERSITY_RECORD_MAX_CONCURRENT_TASKS:-50}
    depends_on:
      university-record-db:
        condition: service_healthy

  university-record-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UNIVERSITY_RECORD_DB_USER}
      POSTGRES_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
      POSTGRES_DB: ${UNIVERSITY_RECORD_DB_NAME}
    volumes:
      - university_record_db_data:/var/lib/postgresql/data
      - ./db/university-record-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNIVERSITY_RECORD_DB_USER} -d ${UNIVERSITY_RECORD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Moderation Service (Liviu) ====================
  moderation-service:
    image: d3adeye/moderation-service:2.0.0-rc.2
    restart: unless-stopped
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/moderation.
    environment:
      PORT: 3007
      APPLICANT_SERVICE_URL: http://gateway:3000/applicant
      CREDENTIAL_SERVICE_URL: http://gateway:3000/credential
      RULES_SERVICE_URL: http://gateway:3000/server-rules
      UNIVERSITY_RECORD_SERVICE_URL: http://gateway:3000/university-record
      DISCORD_DMS_SERVICE_URL: http://gateway:3000/discord-dms
      DB_HOST: moderation-db
      DB_PORT: 5432
      DB_USER: ${MODERATION_DB_USER}
      DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      DB_NAME: ${MODERATION_DB_NAME}
    depends_on:
      moderation-db:
        condition: service_healthy

  moderation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MODERATION_DB_USER}
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD}
      POSTGRES_DB: ${MODERATION_DB_NAME}
    volumes:
      - moderation_db_data:/var/lib/postgresql/data
      - ./db/moderation-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MODERATION_DB_USER} -d ${MODERATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Discord DMs Service (Liviu) ====================
  discord-dms-service:
    image: d3adeye/discord-dms-service:2.0.0-rc.1
    restart: unless-stopped
    # Only the WebSocket port is published. A client negotiates with the Gateway
    # and then connects to the socket directly, rather than keeping the Gateway
    # busy proxying a long-lived connection. REST lives on 3009, which stays
    # inside the network, so it can only be reached through the Gateway.
    ports:
      - "3008:3008"
    environment:
      WS_PORT: 3008
      HTTP_PORT: 3009
      MONGODB_URI: mongodb://${DISCORD_DMS_DB_USER}:${DISCORD_DMS_DB_PASSWORD}@discord-dms-db:27017/?authSource=admin
      MONGODB_DATABASE: ${DISCORD_DMS_DB_NAME}
      SESSION_SERVICE_URL: http://gateway:3000/session
    depends_on:
      discord-dms-db:
        condition: service_healthy

  discord-dms-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DISCORD_DMS_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DISCORD_DMS_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DISCORD_DMS_DB_NAME}
    volumes:
      - discord_dms_db_data:/data/db
      - ./db/discord-dms-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  player_db_data:
  session_db_data:
  applicant_db_data:
  credential_db_data:
  rules_db_data:
  university_record_db_data:
  moderation_db_data:
  discord_dms_db_data: