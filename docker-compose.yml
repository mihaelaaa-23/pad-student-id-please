  applicant-db-3:
    <<: *applicant-db
    hostname: applicant-db-3
    environment:
      SERVICE_NAME: applicant-db-3
      RS_NAME: rs-applicant
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
    volumes:
      - applicant_db_3_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro

  # One-shot rs.initiate(); exits 0 on a set that is already initiated.
  applicant-db-rs-init:
    image: mongo:7
    restart: "no"
    command: ["sh", "/init-replica-set.sh"]
    environment:
      SERVICE_NAME: applicant-db-rs-init
      RS_NAME: rs-applicant
      RS_MEMBERS: applicant-db-1:27017,applicant-db-2:27017,applicant-db-3:27017
