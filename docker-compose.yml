  credential-db-2:
    <<: *credential-db
    hostname: credential-db-2
    environment:
      SERVICE_NAME: credential-db-2
      RS_NAME: rs-credential
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
    volumes:
      - credential_db_2_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro

  credential-db-3:
