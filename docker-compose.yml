services:
  # ==================== Gateway (Mihaela) ====================
  # The single entry point. It waits only for Service Discovery: it reads the instance
  # list from it at startup and answers 502 BAD_GATEWAY for a service until it is up.
  gateway:
    image: mihaela5/gateway:4.0.0-rc.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Lab 4, grade 5: every request goes to the Message Broker, which picks the instance
      # and runs the circuit breaker (both moved there from the Gateway). The Gateway
      # authenticates to it with SERVICE_TOKEN below.
      MESSAGE_BROKER_URL: http://message-broker:3011
      # Lab 3: the Gateway still registers itself, so Service Discovery health-polls it.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-10000}
      # Lab 2, grade 8: requests forwarded at once, service-to-service calls included;
      # the next one gets 503 CONCURRENCY_LIMIT_REACHED with Retry-After: 1. Far above a
      # service's 50 on purpose: one client request holds a slot per hop (README,
      # Gateway notes: 50 x 8 hops = 400 < 500).
      MAX_CONCURRENT_TASKS: ${GATEWAY_MAX_CONCURRENT_TASKS:-500}
      # Lab 2, grade 10: authorization. The Gateway validates the player token
      # (JWT_SECRET, the secret Player Service signs it with) or the service token,
      # tells the service who is calling (X-Player-Id, X-Caller-Type) and never
      # forwards Authorization itself. Both are required and must differ.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, see .env.example}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # Signs the tickets that authorise a websocket connection; Discord DMs
      # verifies them with the same secret.
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:-}
      # The address the *client* connects to. The in-network name above means
      # nothing outside this network, and this URL is handed to the client.
      DISCORD_DMS_WS_PUBLIC_URL: ws://localhost:3008
    # service_started, not service_healthy: with no list from Service Discovery the Gateway
    # routes to the fixed upstreams above, so Service Discovery failing to start does not
    # take down the only entry point.
    depends_on:
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_started

  # ==================== Service Discovery (Ciprian) ====================
  # Internal registry; no host port is published. This image defines its own
  # Docker health check on /health.
  service-discovery:
    image: ciprik13/service-discovery:4.0.0-rc.1
    restart: unless-stopped
    environment:
      PORT: 3010
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      LOG_LEVEL: ${SERVICE_DISCOVERY_LOG_LEVEL:-INFO}
      # Lab 3, grade 9: health alerts are also posted to this Discord webhook. Empty
      # means they are only logged. A credential: set it in .env, never here.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}

  # ==================== Message Broker (Mihaela) ====================
  # Lab 4: forwarding between the Gateway and the services and between services, with
  # round-robin load balancing and the circuit breaker (moved from the Gateway). Not
  # published: only the Gateway and the services reach it, with the service token.
  # One thread per request; GET /status stays outside its concurrency limit.
  message-broker:
    image: mihaela5/message-broker:4.0.0-rc.5
    restart: unless-stopped
    environment:
      PORT: 3011
      LOG_LEVEL: ${MESSAGE_BROKER_LOG_LEVEL:-INFO}
      # Every forwarded request must carry it (Authorization: Bearer); the Broker also
      # registers with Service Discovery with it.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # The least-loaded healthy instance Service Discovery lists (LB_STRATEGY=load); the
      # fixed URLs below stay for a service it does not list.
      # Lab 4: gRPC (Publish, topic deliveries, service-to-service calls) on 50011, inside
      # the compose network only. Its own limit matches MAX_CONCURRENT_TASKS, so the
      # Broker's shared limit is the one a gRPC caller meets.
      BROKER_GRPC_PORT: 50011
      GRPC_MAX_CONCURRENT_RPCS: ${MESSAGE_BROKER_MAX_CONCURRENT_TASKS:-500}
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      BREAKER_MODE: ${BREAKER_MODE:-remove}
      PLAYER_SERVICE_URL: http://player-service:3001
      SESSION_SERVICE_URL: http://session-service:3002
      APPLICANT_SERVICE_URL: http://applicant-service:3003
      CREDENTIAL_SERVICE_URL: http://credential-service:3004
      RULES_SERVICE_URL: http://server-rules-service:3005
      UNIVERSITY_RECORD_SERVICE_URL: http://university-record-service:3006
      MODERATION_SERVICE_URL: http://moderation-service:3007
      # REST port; 3008 is the WebSocket listener alone.
      DISCORD_DMS_SERVICE_URL: http://discord-dms-service:3009
      UPSTREAM_TIMEOUT_MS: ${MESSAGE_BROKER_UPSTREAM_TIMEOUT_MS:-10000}
      # Same reasoning as the Gateway's 500: one client request holds a slot per hop.
      MAX_CONCURRENT_TASKS: ${MESSAGE_BROKER_MAX_CONCURRENT_TASKS:-500}
    # service_started, like the Gateway: without Service Discovery it uses the fixed URLs.
    depends_on:
      service-discovery:
        condition: service_started

  # ==================== Monitoring (Liviu) ====================
  # Prometheus scrapes GET /metrics on every service; Grafana reads Prometheus.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3000 is the Gateway, so Grafana is published on 3100.
  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    ports:
      - "${HOST_GRAFANA_PORT:-3100}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  # ==================== Player Service (Mihaela) ====================
  player-service:
    image: mihaela5/player-service:4.0.0-rc.2
    restart: unless-stopped
    # Lab 3, grade 5: two instances. Each registers its own container hostname with
    # Service Discovery, so there is no fixed host port and no container_name.
    deploy:
      replicas: ${PLAYER_REPLICAS:-2}
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/player.
    environment:
      PORT: 3001
      DB_HOST: player-db
      DB_PORT: 5432
      DB_USER: ${PLAYER_DB_USER}
      DB_PASSWORD: ${PLAYER_DB_PASSWORD}
      DB_NAME: ${PLAYER_DB_NAME}
      # Lab 2, grade 8: task timeout (504 TASK_TIMEOUT) and concurrent task limit
      # (503 CONCURRENCY_LIMIT_REACHED). A leaf in the timeout budget: 2000, below the
      # 4500 Session waits for it.
      TASK_TIMEOUT_MS: ${PLAYER_TASK_TIMEOUT_MS:-2000}
      MAX_CONCURRENT_TASKS: ${PLAYER_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: the share of MAX_CONCURRENT_TASKS at which /status reports
      # load.critical, which Service Discovery alerts on (same rule as Moderation).
      LOAD_CRITICAL_PERCENT: ${PLAYER_LOAD_CRITICAL_PERCENT:-80}
      # Lab 2, grade 10: signs the login token (JWT, HS256). Required, at least 32
      # characters; the service does not start without it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, see .env.example}
      # The Gateway's authorization is on, so a protected route called without its
      # caller headers did not come through the Gateway: refuse it (401).
      REQUIRE_CALLER_HEADERS: "true"
      # Lab 3: register on startup, heartbeat, deregister on shutdown.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      # Lab 4, grades 6 and 8: serves events.v1.EventSink/Deliver on 50001 and subscribes
      # to session.ended, both sent with the registration, so the Broker delivers the shift
      # XP to it (idempotent by event id).
      GRPC_PORT: 50001
      SD_TOPICS: session.ended
    depends_on:
      player-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  player-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAYER_DB_USER}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD}
      POSTGRES_DB: ${PLAYER_DB_NAME}
    volumes:
      - player_db_data:/var/lib/postgresql/data
      - ./db/player-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_DB_USER} -d ${PLAYER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Server Moderation Session Service (Mihaela) ====================
  session-service:
    image: mihaela5/session-service:4.0.0-rc.3
    restart: unless-stopped
    # Lab 3, grade 5: two instances; sessions live in session-db, so any instance can
    # serve any session.
    deploy:
      replicas: ${SESSION_REPLICAS:-2}
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/session.
    environment:
      PORT: 3002
      DB_HOST: session-db
      DB_PORT: 5432
      DB_USER: ${SESSION_DB_USER}
      DB_PASSWORD: ${SESSION_DB_PASSWORD}
      DB_NAME: ${SESSION_DB_NAME}
      # Through the Message Broker, like every service-to-service call (Lab 4, grade 5).
      PLAYER_SERVICE_URL: http://message-broker:3011/player
      APPLICANT_SERVICE_URL: http://message-broker:3011/applicant
      CREDENTIAL_SERVICE_URL: http://message-broker:3011/credential
      RULES_SERVICE_URL: http://message-broker:3011/server-rules
      UNIVERSITY_RECORD_SERVICE_URL: http://message-broker:3011/university-record
      # Lab 2, grade 8: task timeout (504 TASK_TIMEOUT) and concurrent task limit
      # (503 CONCURRENCY_LIMIT_REACHED). Timeout budget (README, Gateway notes): 4500 per
      # outgoing call > every callee's TASK_TIMEOUT_MS; own cap 8000 < the Gateway's 10000.
      HTTP_TIMEOUT_MS: ${SESSION_HTTP_TIMEOUT_MS:-4500}
      TASK_TIMEOUT_MS: ${SESSION_TASK_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_TASKS: ${SESSION_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: the share of MAX_CONCURRENT_TASKS at which /status reports
      # load.critical, which Service Discovery alerts on (same rule as Moderation).
      LOAD_CRITICAL_PERCENT: ${SESSION_LOAD_CRITICAL_PERCENT:-80}
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call, so the
      # Gateway lets this service's own requests through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # Lab 3: register with Service Discovery. Since Lab 4 the circuit breaker on the
      # dependencies is the Broker's, so Session has none of its own.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      # Lab 4, grade 8: serves session.v1.SessionService/GetSession on 50002 for Discord
      # DMs, registered with Service Discovery as its grpcUrl.
      GRPC_PORT: 50002
      # Lab 4, grade 6: ending a shift publishes one session.ended event to the Broker
      # instead of a PATCH /players/{id}/xp per participant; Player subscribes to it.
      BROKER_GRPC_URL: message-broker:50011
      PUBLISH_TIMEOUT_MS: ${SESSION_PUBLISH_TIMEOUT_MS:-1500}
    depends_on:
      session-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_started

  session-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SESSION_DB_USER}
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD}
      POSTGRES_DB: ${SESSION_DB_NAME}
    volumes:
      - session_db_data:/var/lib/postgresql/data
      - ./db/session-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESSION_DB_USER} -d ${SESSION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Applicant Service (Ciprian) ====================
  applicant-service:
    image: ciprik13/applicant-service:3.0.0
    restart: unless-stopped
    # Lab 3, grade 5: two instances, sharing applicant-db (STORE_DRIVER mongo).
    deploy:
      replicas: ${APPLICANT_REPLICAS:-2}
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/applicant.
    environment:
      PORT: 3003
      STORE_DRIVER: mongo
      DECEPTIVE_RATE: ${APPLICANT_DECEPTIVE_RATE:-0.35}
      DB_HOST: applicant-db
      DB_PORT: 27017
      DB_USER: ${APPLICANT_DB_USER}
      DB_PASSWORD: ${APPLICANT_DB_PASSWORD}
      DB_NAME: ${APPLICANT_DB_NAME}
      # Through the Message Broker, like every service-to-service call (Lab 4, grade 5).
      UNIVERSITY_RECORD_SERVICE_URL: http://message-broker:3011/university-record
      # Lab 2, grade 8: per-request task timeout (504 TASK_TIMEOUT) and concurrent
      # task limit (503 CONCURRENCY_LIMIT_REACHED). Test hooks stay off unless a
      # demo of the 503/504 turns them on through .env.
      # Timeout budget (README, Gateway notes): outgoing 2500 > University Record's 2000,
      # own task 3000 > outgoing 2500, and below Credential's 3500 for this service.
      HTTP_TIMEOUT_MS: ${APPLICANT_HTTP_TIMEOUT_MS:-2500}
      TASK_TIMEOUT_MS: ${APPLICANT_TASK_TIMEOUT_MS:-3000}
      MAX_CONCURRENT_TASKS: ${APPLICANT_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: the share of MAX_CONCURRENT_TASKS at which /status reports
      # load.critical, which Service Discovery alerts on (same rule as Moderation).
      LOAD_CRITICAL_PERCENT: ${APPLICANT_LOAD_CRITICAL_PERCENT:-80}
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call, so the
      # Gateway lets this service's own requests through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      ENABLE_TEST_HOOKS: ${ENABLE_TEST_HOOKS:-false}
      # Lab 3: register with Service Discovery; circuit breaker on University Record.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      BREAKER_MODE: ${BREAKER_MODE:-remove}
    depends_on:
      applicant-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  applicant-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${APPLICANT_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${APPLICANT_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${APPLICANT_DB_NAME}
    volumes:
      - applicant_db_data:/data/db
      - ./db/applicant-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Credential Service (Ciprian) ====================
  credential-service:
    image: ciprik13/credential-service:3.0.0
    restart: unless-stopped
    # Lab 3, grade 5: two instances, sharing credential-db (STORE_DRIVER mongo).
    deploy:
      replicas: ${CREDENTIAL_REPLICAS:-2}
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/credential.
    environment:
      PORT: 3004
      STORE_DRIVER: mongo
      CREDENTIAL_SIGNING_SECRET: ${CREDENTIAL_SIGNING_SECRET}
      # Through the Message Broker, like every service-to-service call (Lab 4, grade 5).
      # Unset would mean every request that needs Applicant Service answers
      # 503 DEPENDENCY_UNAVAILABLE even though the real service is running here.
      APPLICANT_SERVICE_URL: http://message-broker:3011/applicant
      DB_HOST: credential-db
      DB_PORT: 27017
      DB_USER: ${CREDENTIAL_DB_USER}
      DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
      DB_NAME: ${CREDENTIAL_DB_NAME}
      # Lab 2, grade 8: per-request task timeout (504 TASK_TIMEOUT) and concurrent
      # task limit (503 CONCURRENCY_LIMIT_REACHED). Test hooks stay off unless a
      # demo of the 503/504 turns them on through .env.
      # Timeout budget (README, Gateway notes): outgoing 3500 > Applicant's 3000,
      # own task 4000 > outgoing 3500, and below Session's 4500 for this service.
      HTTP_TIMEOUT_MS: ${CREDENTIAL_HTTP_TIMEOUT_MS:-3500}
      TASK_TIMEOUT_MS: ${CREDENTIAL_TASK_TIMEOUT_MS:-4000}
      MAX_CONCURRENT_TASKS: ${CREDENTIAL_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: the share of MAX_CONCURRENT_TASKS at which /status reports
      # load.critical, which Service Discovery alerts on (same rule as Moderation).
      LOAD_CRITICAL_PERCENT: ${CREDENTIAL_LOAD_CRITICAL_PERCENT:-80}
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call, so the
      # Gateway lets this service's own requests through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      ENABLE_TEST_HOOKS: ${ENABLE_TEST_HOOKS:-false}
      # Lab 3: register with Service Discovery; circuit breaker on Applicant.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      BREAKER_MODE: ${BREAKER_MODE:-remove}
    depends_on:
      credential-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  credential-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CREDENTIAL_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${CREDENTIAL_DB_NAME}
    volumes:
      - credential_db_data:/data/db
      - ./db/credential-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Server Rules Service (Ion) ====================
  server-rules-service:
    image: ion190/server-rules-service:3.0.0
    restart: unless-stopped
    deploy:
      replicas: ${RULES_REPLICAS:-2}
    environment:
      PORT: 3005
      GRPC_PORT: 50005
      GRPC_HOST: 0.0.0.0
      DB_HOST: rules-db
      DB_PORT: 27017
      DB_USER: ${RULES_DB_USER}
      DB_PASSWORD: ${RULES_DB_PASSWORD}
      DB_NAME: ${RULES_DB_NAME}
      UNIVERSITY_RECORD_SERVICE_URL: http://message-broker:3011/university-record
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      TASK_TIMEOUT_MS: ${RULES_TASK_TIMEOUT_MS:-3000}
      MAX_CONCURRENT_TASKS: ${RULES_MAX_CONCURRENT_TASKS:-50}
      HTTP_TIMEOUT_MS: ${RULES_HTTP_TIMEOUT_MS:-2500}
      BREAKER_MODE: ${BREAKER_MODE:-remove}
      LOAD_CRITICAL_PERCENT: ${RULES_LOAD_CRITICAL_PERCENT:-80}
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
    depends_on:
      rules-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  rules-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RULES_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${RULES_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${RULES_DB_NAME}
    volumes:
      - rules_db_data:/data/db
      - ./db/server-rules-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== University Record Service (Ion) ====================
  university-record-service:
    image: ion190/university-record-service:3.0.0
    restart: unless-stopped
    deploy:
      replicas: ${UNIVERSITY_RECORD_REPLICAS:-2}
    environment:
      PORT: 3006
      GRPC_PORT: 50006
      GRPC_HOST: 0.0.0.0
      DB_HOST: university-record-db
      DB_PORT: 5432
      DB_USER: ${UNIVERSITY_RECORD_DB_USER}
      DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
      DB_NAME: ${UNIVERSITY_RECORD_DB_NAME}
      TASK_TIMEOUT_MS: ${UNIVERSITY_RECORD_TASK_TIMEOUT_MS:-2000}
      MAX_CONCURRENT_TASKS: ${UNIVERSITY_RECORD_MAX_CONCURRENT_TASKS:-50}
      LOAD_CRITICAL_PERCENT: ${UNIVERSITY_RECORD_LOAD_CRITICAL_PERCENT:-80}
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
    depends_on:
      university-record-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  university-record-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UNIVERSITY_RECORD_DB_USER}
      POSTGRES_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
      POSTGRES_DB: ${UNIVERSITY_RECORD_DB_NAME}
    volumes:
      - university_record_db_data:/var/lib/postgresql/data
      - ./db/university-record-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNIVERSITY_RECORD_DB_USER} -d ${UNIVERSITY_RECORD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Moderation Service (Liviu) ====================
  moderation-service:
    image: d3adeye/moderation-service:4.0.0-rc.3
    restart: unless-stopped
    # Lab 3, grade 5: two instances. Each registers its own container hostname with
    # Service Discovery, so there is no fixed host port and no container_name. The
    # audit trail lives in moderation-db, so any instance can serve any decision.
    deploy:
      replicas: ${MODERATION_REPLICAS:-2}
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/moderation.
    environment:
      PORT: 3007
      APPLICANT_SERVICE_URL: http://message-broker:3011/applicant
      CREDENTIAL_SERVICE_URL: http://message-broker:3011/credential
      RULES_SERVICE_URL: http://message-broker:3011/server-rules
      UNIVERSITY_RECORD_SERVICE_URL: http://message-broker:3011/university-record
      DISCORD_DMS_SERVICE_URL: http://message-broker:3011/discord-dms
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call, so the
      # Gateway lets this service's own requests through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # Lab 2, grade 8: per-request task timeout (504 TASK_TIMEOUT) and concurrent
      # task limit (503 CONCURRENCY_LIMIT_REACHED). /status is exempt.
      HTTP_TIMEOUT_MS: ${MODERATION_HTTP_TIMEOUT_MS:-4500}
      TASK_TIMEOUT_MS: ${MODERATION_TASK_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_TASKS: ${MODERATION_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: the share of MAX_CONCURRENT_TASKS at which /status reports
      # load.critical, which Service Discovery alerts on.
      LOAD_CRITICAL_PERCENT: ${MODERATION_LOAD_CRITICAL_PERCENT:-80}
      # Lab 3, grades 4-5: register on startup, heartbeat, deregister on shutdown.
      # Since Lab 4 the circuit breaker on the dependencies is the Broker's, so this
      # service has none of its own.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      # Lab 4, grade 6: decision.recorded is published to the Broker over gRPC,
      # and Discord DMs announces it in chat.
      BROKER_GRPC_URL: message-broker:50011
      # Lab 4, grade 8: which dependencies are called over gRPC instead of REST.
      # Empty until Applicant, Credential, Server Rules and University Record run
      # images that serve gRPC: the Broker answers a call for a service with no
      # gRPC instance with Unavailable, and that fails the decision. Add each name
      # here as its image lands, comma-separated.
      # The four URLs above stay set either way: an empty one means that
      # dependency does not exist and the decision answers 503
      # DEPENDENCY_UNAVAILABLE.
      GRPC_DEPENDENCIES: ""
      # Lab 3, grade 3: DEBUG, INFO, WARN or ERROR.
      LOG_LEVEL: ${MODERATION_LOG_LEVEL:-INFO}
      DB_HOST: moderation-db
      DB_PORT: 5432
      DB_USER: ${MODERATION_DB_USER}
      DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      DB_NAME: ${MODERATION_DB_NAME}
    depends_on:
      moderation-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_started

  moderation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MODERATION_DB_USER}
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD}
      POSTGRES_DB: ${MODERATION_DB_NAME}
    volumes:
      - moderation_db_data:/var/lib/postgresql/data
      - ./db/moderation-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MODERATION_DB_USER} -d ${MODERATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Discord DMs Service (Liviu) ====================
  discord-dms-service:
    image: d3adeye/discord-dms-service:4.0.0-rc.2
    restart: unless-stopped
    # One instance on purpose (Lab 3, grade 5): 3008 is published to the host, and a
    # message sent to one replica would not reach sockets connected to another.
    # Only the WebSocket port is published. A client negotiates with the Gateway
    # and then connects to the socket directly, rather than keeping the Gateway
    # busy proxying a long-lived connection. REST lives on 3009, which stays
    # inside the network, so it can only be reached through the Gateway.
    ports:
      - "3008:3008"
    environment:
      WS_PORT: 3008
      HTTP_PORT: 3009
      MONGODB_URI: mongodb://${DISCORD_DMS_DB_USER}:${DISCORD_DMS_DB_PASSWORD}@discord-dms-db:27017/?authSource=admin
      MONGODB_DATABASE: ${DISCORD_DMS_DB_NAME}
      SESSION_SERVICE_URL: http://message-broker:3011/session
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:-}
      # Lab 2, grade 10: sent as Authorization: Bearer on the session check, so the
      # Gateway lets this service's own request through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # Lab 2, grade 8: the REST listener only. A socket is open for a whole
      # shift, so neither limit applies to the websocket port.
      HTTP_TIMEOUT_MS: ${DISCORD_DMS_HTTP_TIMEOUT_MS:-8500}
      TASK_TIMEOUT_MS: ${DISCORD_DMS_TASK_TIMEOUT_MS:-9000}
      MAX_CONCURRENT_TASKS: ${DISCORD_DMS_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: what counts as critical load. REST is a share of
      # MAX_CONCURRENT_TASKS; sockets sit outside that limit, so they have a ceiling
      # of their own. Either one makes the instance critical.
      LOAD_CRITICAL_PERCENT: ${DISCORD_DMS_LOAD_CRITICAL_PERCENT:-80}
      WS_CRITICAL_CONNECTIONS: ${DISCORD_DMS_WS_CRITICAL_CONNECTIONS:-500}
      # Lab 3, grades 4-5: register on startup, heartbeat, deregister on shutdown.
      # The REST port is registered, not the websocket one: that is where /status is.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      # Lab 4, grade 8: the session check goes to the Broker over gRPC, which forwards
      # it to session.v1.SessionService/GetSession. SESSION_SERVICE_URL above is the
      # REST fallback used when this is unset.
      BROKER_GRPC_URL: message-broker:50011
      # Lab 4, grades 6 and 8: serves events.v1.EventSink/Deliver on 50009 and subscribes
      # to decision.recorded, both sent with the registration, so the Broker delivers a
      # recorded verdict here and it is announced in chat (idempotent by event id).
      GRPC_PORT: 50009
      SD_TOPICS: decision.recorded
      # Lab 3, grade 3: DEBUG, INFO, WARN or ERROR.
      LOG_LEVEL: ${DISCORD_DMS_LOG_LEVEL:-INFO}
    depends_on:
      discord-dms-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_started

  discord-dms-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DISCORD_DMS_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DISCORD_DMS_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DISCORD_DMS_DB_NAME}
    volumes:
      - discord_dms_db_data:/data/db
      - ./db/discord-dms-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
  player_db_data:
  session_db_data:
  applicant_db_data:
  credential_db_data:
  rules_db_data:
  university_record_db_data:
  moderation_db_data:
  discord_dms_db_data: