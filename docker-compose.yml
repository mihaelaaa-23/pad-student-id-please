    environment:
      SERVICE_NAME: credential-db-rs-init
      RS_NAME: rs-credential
      RS_MEMBERS: credential-db-1:27017,credential-db-2:27017,credential-db-3:27017
      MONGO_ROOT_USERNAME: ${CREDENTIAL_DB_USER}
      MONGO_ROOT_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
    volumes:
      - ./db/mongo-rs/init-replica-set.sh:/init-replica-set.sh:ro
    depends_on:
      credential-db-1:
        condition: service_healthy
      credential-db-2:
        condition: service_healthy
      credential-db-3:
        condition: service_healthy

  # ==================== Server Rules Service (Ion) ====================
  server-rules-service:
    image: ion190/server-rules-service:5.0.0
    restart: unless-stopped
    deploy:
      replicas: ${RULES_REPLICAS:-2}
    environment:
      PORT: 3005
      GRPC_PORT: 50005
      GRPC_HOST: 0.0.0.0
      # Lab 5: connect to every member and let the MongoDB driver
      # discover the current primary after a replica-set election.
      DB_HOSTS: rules-db-1:27017,rules-db-2:27017,rules-db-3:27017
      DB_REPLICA_SET: rs-rules
      DB_USER: ${RULES_DB_USER}
      DB_PASSWORD: ${RULES_DB_PASSWORD}
      DB_NAME: ${RULES_DB_NAME}
      BROKER_GRPC_URL: message-broker:50011
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      TASK_TIMEOUT_MS: ${RULES_TASK_TIMEOUT_MS:-3000}
      MAX_CONCURRENT_TASKS: ${RULES_MAX_CONCURRENT_TASKS:-50}
      HTTP_TIMEOUT_MS: ${RULES_HTTP_TIMEOUT_MS:-2500}
      BREAKER_MODE: ${BREAKER_MODE:-remove}
      LOAD_CRITICAL_PERCENT: ${RULES_LOAD_CRITICAL_PERCENT:-80}
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
    depends_on:
      # Wait for the one-shot job to initiate rs-rules and observe a PRIMARY.
      rules-db-rs-init:
        condition: service_completed_successfully
      service-discovery:
        condition: service_started

  # rules-db: three MongoDB members forming rs-rules.
  # The first member initializes the root user, seed rules, and ETL read-only user.
  rules-db-1: &rules-db
    image: mongo:7
    restart: unless-stopped
    hostname: rules-db-1
    entrypoint: ["sh", "/mongod-rs.sh"]
    environment:
      SERVICE_NAME: rules-db-1
      RS_NAME: rs-rules
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
      MONGO_WT_CACHE_GB: "0.25"
      MONGO_INITDB_ROOT_USERNAME: ${RULES_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${RULES_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${RULES_DB_NAME}
      ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
    volumes:
