        condition: service_completed_successfully
      service-discovery:
        condition: service_started

  # ==================== University Record PostgreSQL HA (Ion) ====================
  # Three Spilo nodes share one Patroni scope and elect a leader through etcd.
  # The application connects through pg-router:5406; replicas are available at 5506.
  university-record-db-1: &university-record-db
    image: ghcr.io/zalando/spilo-16:3.3-p1
    restart: unless-stopped
    hostname: university-record-db-1
    environment: &university-record-db-env
      SCOPE: university-record-db
      PGVERSION: "16"
      ETCD3_HOST: etcd:2379
      SPILO_PROVIDER: local
      PGPASSWORD_SUPERUSER: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in .env, see .env.example}
      PGPASSWORD_ADMIN: ${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD in .env, see .env.example}
      PGPASSWORD_STANDBY: ${PG_REPLICATION_PASSWORD:?set PG_REPLICATION_PASSWORD in .env, see .env.example}
      ALLOW_NOSSL: "true"
      # Per node, advertised by hostname: see player-db-1.
      SPILO_CONFIGURATION: |
        restapi:
          connect_address: university-record-db-1:8008
        postgresql:
          connect_address: university-record-db-1:5432
          parameters:
            shared_buffers: 128MB
    volumes:
      - university_record_db_1_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy

  university-record-db-2:
    <<: *university-record-db
    hostname: university-record-db-2
    environment:
      <<: *university-record-db-env
      SPILO_CONFIGURATION: |
        restapi:
          connect_address: university-record-db-2:8008
        postgresql:
          connect_address: university-record-db-2:5432
          parameters:
            shared_buffers: 128MB
    volumes:
      - university_record_db_2_data:/home/postgres/pgdata

  university-record-db-3:
    <<: *university-record-db
    hostname: university-record-db-3
    environment:
      <<: *university-record-db-env
      SPILO_CONFIGURATION: |
        restapi:
          connect_address: university-record-db-3:8008
        postgresql:
          connect_address: university-record-db-3:5432
          parameters:
            shared_buffers: 128MB
    volumes:
      - university_record_db_3_data:/home/postgres/pgdata

  # Idempotent application-role, database, init-SQL and ETL-reader setup.
  university-record-db-init:
    image: postgres:16-alpine
    restart: "no"
    command: ["sh", "/init-app-db.sh"]
    environment:
      SERVICE_NAME: university-record-db-init
      PGHOST: pg-router
      PGPORT: 5406
      PGUSER: postgres
      PGPASSWORD: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in .env, see .env.example}
      APP_DB_USER: ${UNIVERSITY_RECORD_DB_USER}
      APP_DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
      APP_DB_NAME: ${UNIVERSITY_RECORD_DB_NAME}
      ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
    volumes:
      - ./db/postgres-ha/init-app-db.sh:/init-app-db.sh:ro
      - ./db/university-record-service/init.sql:/init-sql/init.sql:ro
    depends_on:
      pg-router:
        condition: service_healthy
      university-record-db-1:
        condition: service_healthy
      university-record-db-2:
        condition: service_healthy
      university-record-db-3:
        condition: service_healthy

  # ==================== Moderation Service (Liviu) ====================
  moderation-service:
    image: d3adeye/moderation-service:5.0.0-rc.1
    restart: unless-stopped
    # Lab 3, grade 5: two instances. Each registers its own container hostname with
    # Service Discovery, so there is no fixed host port and no container_name. The
    # audit trail lives in moderation-db, so any instance can serve any decision.
    deploy:
      replicas: ${MODERATION_REPLICAS:-2}
    # Not published: every REST call reaches this service through the Gateway,
    # at http://localhost:3000/moderation.
    environment:
      PORT: 3007
      APPLICANT_SERVICE_URL: http://message-broker:3011/applicant
      CREDENTIAL_SERVICE_URL: http://message-broker:3011/credential
      RULES_SERVICE_URL: http://message-broker:3011/server-rules
      UNIVERSITY_RECORD_SERVICE_URL: http://message-broker:3011/university-record
      DISCORD_DMS_SERVICE_URL: http://message-broker:3011/discord-dms
      # Lab 2, grade 10: sent as Authorization: Bearer on every outgoing call, so the
      # Gateway lets this service's own requests through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # Lab 2, grade 8: per-request task timeout (504 TASK_TIMEOUT) and concurrent
      # task limit (503 CONCURRENCY_LIMIT_REACHED). /status is exempt.
      HTTP_TIMEOUT_MS: ${MODERATION_HTTP_TIMEOUT_MS:-4500}
      TASK_TIMEOUT_MS: ${MODERATION_TASK_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_TASKS: ${MODERATION_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: the share of MAX_CONCURRENT_TASKS at which /status reports
      # load.critical, which Service Discovery alerts on.
      LOAD_CRITICAL_PERCENT: ${MODERATION_LOAD_CRITICAL_PERCENT:-80}
      # Lab 3, grades 4-5: register on startup, heartbeat, deregister on shutdown.
      # Since Lab 4 the circuit breaker on the dependencies is the Broker's, so this
      # service has none of its own.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      # Lab 4, grade 6: decision.recorded is published to the Broker over gRPC,
      # and Discord DMs announces it in chat.
      BROKER_GRPC_URL: message-broker:50011
      # Lab 4, grade 8: all four dependencies are called over gRPC through the Broker.
      # Applicant, Credential, Server Rules and University Record all serve gRPC.
      GRPC_DEPENDENCIES: "applicant-service,credential-service,server-rules-service,university-record-service"
      # Lab 3, grade 3: DEBUG, INFO, WARN or ERROR.
      LOG_LEVEL: ${MODERATION_LOG_LEVEL:-INFO}
      # Lab 5, grade 5: pg-router's leader port, so a failover moves the writes to the
      # new leader without the service knowing. Host and port only: no code change.
      DB_HOST: pg-router
      DB_PORT: 5407
      DB_USER: ${MODERATION_DB_USER}
      DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      DB_NAME: ${MODERATION_DB_NAME}
      # Lab 5, grade 8: a decision is a two-phase commit moderation.decision, run by the
      # Broker's coordinator, with Session applying it to the score. This service serves
      # tx.v1.Participant on GRPC_PORT (registered as grpcUrl) and gives the coordinator
      # TX_TIMEOUT_MS, under TASK_TIMEOUT_MS. TX_MODE=local is the Lab 4 behaviour.
      GRPC_PORT: 50007
      TX_MODE: 2pc
      TX_TIMEOUT_MS: 6000
    depends_on:
      # Not the nodes but the init job: a healthy Patroni node is not yet a database
      # with the application role, the schema and etl_reader in it.
      moderation-db-init:
        condition: service_completed_successfully
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_started

  # moderation-db: three Spilo nodes (Patroni + PostgreSQL 16), one leader and two
  # streaming replicas, reached through pg-router on 5407 (leader) and 5507 (replicas).
  # Copied from player-db, so see that cluster for what each variable does.
  moderation-db-1: &moderation-db
    image: ghcr.io/zalando/spilo-16:3.3-p1
    restart: unless-stopped
    hostname: moderation-db-1
    environment: &moderation-db-env
      SCOPE: moderation-db
      PGVERSION: "16"
      ETCD3_HOST: etcd:2379
      SPILO_PROVIDER: local
      PGPASSWORD_SUPERUSER: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in .env, see .env.example}
      PGPASSWORD_ADMIN: ${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD in .env, see .env.example}
      PGPASSWORD_STANDBY: ${PG_REPLICATION_PASSWORD:?set PG_REPLICATION_PASSWORD in .env, see .env.example}
      ALLOW_NOSSL: "true"
      # Per node, so SPILO_CONFIGURATION is overridden on -2 and -3 rather than shared.
      #
      # connect_address: every node is advertised by its compose hostname, not its IP,
      # as in the player-db and university-record-db clusters. A container can come
      # back on a different IP after `docker compose stop` + `up`, and the stale IP in
      # etcd then points the members at the wrong container, so replicas stop streaming
      # and nothing is promoted.
      #
      # Lab 5, grade 8: this cluster takes part in the two-phase commit, so it needs
      # prepared transactions, which PostgreSQL disables by default. Set twice on
      # purpose: under bootstrap.dcs for a cluster initialised from scratch, and under
      # postgresql for a node joining an already bootstrapped one. A node without it
      # refuses PREPARE TRANSACTION, so a decision would abort whenever that node
      # happened to be the leader.
      SPILO_CONFIGURATION: |
        bootstrap:
          dcs:
            postgresql:
              parameters:
                max_prepared_transactions: 64
        restapi:
          connect_address: moderation-db-1:8008
        postgresql:
          connect_address: moderation-db-1:5432
          parameters:
            shared_buffers: 128MB
            max_prepared_transactions: 64
    volumes:
      - moderation_db_1_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy

  moderation-db-2:
    <<: *moderation-db
    hostname: moderation-db-2
    environment:
      <<: *moderation-db-env
      SPILO_CONFIGURATION: |
        bootstrap:
          dcs:
            postgresql:
              parameters:
                max_prepared_transactions: 64
        restapi:
          connect_address: moderation-db-2:8008
        postgresql:
          connect_address: moderation-db-2:5432
          parameters:
            shared_buffers: 128MB
            max_prepared_transactions: 64
    volumes:
      - moderation_db_2_data:/home/postgres/pgdata

  moderation-db-3:
    <<: *moderation-db
    hostname: moderation-db-3
    environment:
      <<: *moderation-db-env
      SPILO_CONFIGURATION: |
        bootstrap:
          dcs:
            postgresql:
              parameters:
                max_prepared_transactions: 64
        restapi:
          connect_address: moderation-db-3:8008
        postgresql:
          connect_address: moderation-db-3:5432
          parameters:
            shared_buffers: 128MB
            max_prepared_transactions: 64
    volumes:
      - moderation_db_3_data:/home/postgres/pgdata

  # Idempotent application-role, database, init-SQL and ETL-reader setup, through the
  # leader port. Spilo bootstraps PostgreSQL itself, so the image never runs
  # /docker-entrypoint-initdb.d and init.sql has to be applied from outside.
  moderation-db-init:
    image: postgres:16-alpine
    restart: "no"
    command: ["sh", "/init-app-db.sh"]
    environment:
      SERVICE_NAME: moderation-db-init
      PGHOST: pg-router
      PGPORT: 5407
      PGUSER: postgres
      PGPASSWORD: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in .env, see .env.example}
      APP_DB_USER: ${MODERATION_DB_USER}
      APP_DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      APP_DB_NAME: ${MODERATION_DB_NAME}
      ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
    volumes:
      - ./db/postgres-ha/init-app-db.sh:/init-app-db.sh:ro
      - ./db/moderation-service/init.sql:/init-sql/init.sql:ro
    depends_on:
      pg-router:
        condition: service_healthy
      moderation-db-1:
        condition: service_healthy
      moderation-db-2:
        condition: service_healthy
      moderation-db-3:
        condition: service_healthy

  # ==================== Discord DMs Service (Liviu) ====================
  discord-dms-service:
    image: d3adeye/discord-dms-service:4.0.0
    restart: unless-stopped
    # One instance on purpose (Lab 3, grade 5): 3008 is published to the host, and a
    # message sent to one replica would not reach sockets connected to another.
    # Only the WebSocket port is published. A client negotiates with the Gateway
    # and then connects to the socket directly, rather than keeping the Gateway
    # busy proxying a long-lived connection. REST lives on 3009, which stays
    # inside the network, so it can only be reached through the Gateway.
    ports:
      - "3008:3008"
    environment:
      WS_PORT: 3008
      HTTP_PORT: 3009
      # Lab 5, grade 5: every member of the set, so the driver keeps writing after a
      # failover. w=majority is what makes an acknowledged write survive losing the
      # primary, which is the point of replicating at all.
      MONGODB_URI: mongodb://${DISCORD_DMS_DB_USER}:${DISCORD_DMS_DB_PASSWORD}@discord-dms-db-1:27017,discord-dms-db-2:27017,discord-dms-db-3:27017/?replicaSet=rs-discord-dms&authSource=admin&retryWrites=true&w=majority
      MONGODB_DATABASE: ${DISCORD_DMS_DB_NAME}
      SESSION_SERVICE_URL: http://message-broker:3011/session
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:-}
      # Lab 2, grade 10: sent as Authorization: Bearer on the session check, so the
      # Gateway lets this service's own request through.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env, see .env.example}
      # Lab 2, grade 8: the REST listener only. A socket is open for a whole
      # shift, so neither limit applies to the websocket port.
      HTTP_TIMEOUT_MS: ${DISCORD_DMS_HTTP_TIMEOUT_MS:-8500}
      TASK_TIMEOUT_MS: ${DISCORD_DMS_TASK_TIMEOUT_MS:-9000}
      MAX_CONCURRENT_TASKS: ${DISCORD_DMS_MAX_CONCURRENT_TASKS:-50}
      # Lab 3, grade 8: what counts as critical load. REST is a share of
      # MAX_CONCURRENT_TASKS; sockets sit outside that limit, so they have a ceiling
      # of their own. Either one makes the instance critical.
      LOAD_CRITICAL_PERCENT: ${DISCORD_DMS_LOAD_CRITICAL_PERCENT:-80}
      WS_CRITICAL_CONNECTIONS: ${DISCORD_DMS_WS_CRITICAL_CONNECTIONS:-500}
      # Lab 3, grades 4-5: register on startup, heartbeat, deregister on shutdown.
      # The REST port is registered, not the websocket one: that is where /status is.
      SERVICE_DISCOVERY_URL: http://service-discovery:3010
      SD_HEARTBEAT_MS: ${SD_HEARTBEAT_MS:-10000}
      # Lab 4, grade 8: the session check goes to the Broker over gRPC, which forwards
      # it to session.v1.SessionService/GetSession. SESSION_SERVICE_URL above is the
      # REST fallback used when this is unset.
      BROKER_GRPC_URL: message-broker:50011
      # Lab 4, grades 6 and 8: serves events.v1.EventSink/Deliver on 50009 and subscribes
      # to decision.recorded, both sent with the registration, so the Broker delivers a
      # recorded verdict here and it is announced in chat (idempotent by event id).
      GRPC_PORT: 50009
      SD_TOPICS: decision.recorded
      # Lab 3, grade 3: DEBUG, INFO, WARN or ERROR.
      LOG_LEVEL: ${DISCORD_DMS_LOG_LEVEL:-INFO}
    depends_on:
      # Not the members but the init job: a healthy mongod is not yet a replica set,
      # and the service's first write needs a primary.
      discord-dms-db-rs-init:
        condition: service_completed_successfully
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_started

  # discord-dms-db: three mongod members forming the replica set rs-discord-dms, one
  # primary and two secondaries. The template for the other Mongo clusters: copy the
  # three members and the -rs-init job, then change RS_NAME, the hostnames, the
  # volumes, the init.js mount and the DISCORD_DMS_DB_* values.
  #
  # Only member -1 carries MONGO_INITDB_ROOT_* and the init.js mount, because the
  # image runs them against an empty data directory and the set then replicates the
  # users, the database and its indexes to the others. Giving the same variables to
  # -2 and -3 would have them bootstrap their own standalone users, which is what
  # makes rs.initiate() fail. That is also why -2 and -3 repeat only the two
  # variables every member needs rather than inheriting the whole block.
  discord-dms-db-1: &discord-dms-db
    image: mongo:7
    restart: unless-stopped
    hostname: discord-dms-db-1
    # The keyfile for internal authentication is written inside the container,
    # because mongod refuses a keyfile that is group- or world-readable.
    entrypoint: ["sh", "/mongod-rs.sh"]
    environment:
      SERVICE_NAME: discord-dms-db-1
      RS_NAME: rs-discord-dms
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
      MONGO_INITDB_ROOT_USERNAME: ${DISCORD_DMS_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DISCORD_DMS_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DISCORD_DMS_DB_NAME}
      ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
    volumes:
      - discord_dms_db_1_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro
      - ./db/discord-dms-service/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  discord-dms-db-2:
    <<: *discord-dms-db
    hostname: discord-dms-db-2
    environment:
      SERVICE_NAME: discord-dms-db-2
      RS_NAME: rs-discord-dms
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
    volumes:
      - discord_dms_db_2_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro

  discord-dms-db-3:
    <<: *discord-dms-db
    hostname: discord-dms-db-3
    environment:
      SERVICE_NAME: discord-dms-db-3
      RS_NAME: rs-discord-dms
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY in .env, see .env.example}
    volumes:
      - discord_dms_db_3_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro

  # mongod --replSet does not form a set by itself: exactly one rs.initiate() names
  # the members. This one-shot job does it, waits for a primary, and exits 0 on a
  # set that is already initiated, so it runs on every `up`. The service waits for
  # it with service_completed_successfully, so it never starts against a set that
  # cannot accept writes.
  discord-dms-db-rs-init:
    image: mongo:7
    restart: "no"
    command: ["sh", "/init-replica-set.sh"]
    environment:
      SERVICE_NAME: discord-dms-db-rs-init
      RS_NAME: rs-discord-dms
      RS_MEMBERS: discord-dms-db-1:27017,discord-dms-db-2:27017,discord-dms-db-3:27017
      MONGO_ROOT_USERNAME: ${DISCORD_DMS_DB_USER}
      MONGO_ROOT_PASSWORD: ${DISCORD_DMS_DB_PASSWORD}
    volumes:
      - ./db/mongo-rs/init-replica-set.sh:/init-replica-set.sh:ro
    depends_on:
      discord-dms-db-1:
        condition: service_healthy
      discord-dms-db-2:
        condition: service_healthy
      discord-dms-db-3:
        condition: service_healthy

  # ==================== Data Warehouse (Mihaela, Lab 5) ====================
  # Lab 5, grade 4: the analytics database, filled by the etl job from every service's
  # database (db/warehouse/init.sql holds the star schema). Not published, and not
  # replicated: everything in it can be rebuilt from the service databases.
  warehouse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
      - ./db/warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER} -d ${WAREHOUSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== ETL (Mihaela, Lab 5) ====================
  # Lab 5, grade 4: the job that copies every service database into warehouse-db,
  # every ETL_INTERVAL_S seconds (etl/etl.py; one pass with `python etl.py --once`).
  # It reads with each service's own database user but over read-only sessions
  # (PostgreSQL) or from a secondary (MongoDB), so it can never change a source.
  # A plain python image with the script mounted: no image of our own to build.
  etl:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /etl
    # etl/start.sh installs the packages into the etl_deps volume once (again only when
    # requirements.txt changes), so restarts need no network.
    command: ["sh", "start.sh"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /deps
      ETL_INTERVAL_S: ${ETL_INTERVAL_S:-60}
      LOG_LEVEL: ${ETL_LOG_LEVEL:-INFO}
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      # player-db is a Spilo cluster since #226: read a replica through pg-router.
      PLAYER_DB_HOST: pg-router
      PLAYER_DB_PORT: "5501"
      # Lab 5: the read-only role player-db-init creates (SELECT only), not Player's own user.
      PLAYER_DB_USER: etl_reader
      PLAYER_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      PLAYER_DB_NAME: ${PLAYER_DB_NAME}
      SESSION_DB_HOST: pg-router
      SESSION_DB_PORT: "5502"
      SESSION_DB_USER: etl_reader
      SESSION_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      SESSION_DB_NAME: ${SESSION_DB_NAME}
      # University Record Spilo replicas: ETL uses the read-only replica endpoint.
      UNIVERSITY_RECORD_DB_HOST: pg-router
      UNIVERSITY_RECORD_DB_PORT: "5506"
      UNIVERSITY_RECORD_DB_USER: etl_reader
      UNIVERSITY_RECORD_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      UNIVERSITY_RECORD_DB_NAME: ${UNIVERSITY_RECORD_DB_NAME}
      MODERATION_DB_HOST: pg-router
      MODERATION_DB_PORT: "5507"
      # Lab 5: the read-only role moderation-db-init creates (SELECT only), not
      # Moderation's own user, and a replica port so the analytics reads never
      # compete with the decisions being written on the leader.
      MODERATION_DB_USER: etl_reader
      MODERATION_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      MODERATION_DB_NAME: ${MODERATION_DB_NAME}
      APPLICANT_DB_HOSTS: applicant-db-1:27017,applicant-db-2:27017,applicant-db-3:27017
      APPLICANT_DB_REPLICA_SET: rs-applicant
      # Lab 5: the read-only etl_reader (role read on this database only).
      APPLICANT_DB_USER: etl_reader
      APPLICANT_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      APPLICANT_DB_NAME: ${APPLICANT_DB_NAME}
      CREDENTIAL_DB_HOSTS: credential-db-1:27017,credential-db-2:27017,credential-db-3:27017
      CREDENTIAL_DB_REPLICA_SET: rs-credential
      # Lab 5: the read-only etl_reader (role read on this database only).
      CREDENTIAL_DB_USER: etl_reader
      CREDENTIAL_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      CREDENTIAL_DB_NAME: ${CREDENTIAL_DB_NAME}
      RULES_DB_HOSTS: rules-db-1:27017,rules-db-2:27017,rules-db-3:27017
      RULES_DB_REPLICA_SET: rs-rules
      # Read from a secondary with a database-scoped read-only account.
      RULES_DB_USER: etl_reader
      RULES_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      RULES_DB_NAME: ${RULES_DB_NAME}
      DISCORD_DMS_DB_HOSTS: discord-dms-db-1:27017,discord-dms-db-2:27017,discord-dms-db-3:27017
      DISCORD_DMS_DB_REPLICA_SET: rs-discord-dms
      # Lab 5: the read-only etl_reader (role read on this database only).
      DISCORD_DMS_DB_USER: etl_reader
      DISCORD_DMS_DB_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD in .env, see .env.example}
      DISCORD_DMS_DB_NAME: ${DISCORD_DMS_DB_NAME}
    volumes:
      - ./etl:/etl:ro
      - etl_deps:/deps
    depends_on:
      warehouse-db:
        condition: service_healthy

volumes:
  alloy_data:
  broker_data:
  loki_data:
  prometheus_data:
  grafana_data:
  etcd_data:
  player_db_1_data:
  player_db_2_data:
  player_db_3_data:
  session_db_1_data:
  session_db_2_data:
  session_db_3_data:
  applicant_db_1_data:
  applicant_db_2_data:
  applicant_db_3_data:
  credential_db_1_data:
  credential_db_2_data:
  credential_db_3_data:
  # Legacy standalone Rules DB volume retained for backup/migration.
  rules_db_data:
  rules_db_1_data:
  rules_db_2_data:
  rules_db_3_data:
  university_record_db_1_data:
  university_record_db_2_data:
  university_record_db_3_data:
  # Legacy standalone database volume; retained for backup and migration recovery.
