    volumes:
      - rules_db_3_data:/data/db
      - ./db/mongo-rs/mongod-rs.sh:/mongod-rs.sh:ro

  # One-shot rs.initiate(); waits for all members and a writable PRIMARY.
  rules-db-rs-init:
    image: mongo:7
    restart: "no"
    command: ["sh", "/init-replica-set.sh"]
    environment:
