# Loki, single process, filesystem storage (Lab 4, grade 4).
# Holds the stdout of every container for 24 h; the Gateway's GET /logs/download and
# Grafana's Loki data source read it. Not published to the host.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retention is applied by the compactor below; without it this setting does nothing.
  retention_period: 24h
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  # The most lines one query may return; GET /logs/download asks for at most 5000.
  max_entries_limit_per_query: 5000
  # When Alloy starts it sends each container's log from the container's start, which on
  # a stack that has been up for hours is far above the default 4 MB/s. Loki answers 429
  # and Alloy retries until it has caught up; these limits let the backlog in at once.
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
