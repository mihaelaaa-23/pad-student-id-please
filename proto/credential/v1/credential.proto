syntax = "proto3";

// Credential Service RPCs called by other services (Lab 4, Grade 8).
package credential.v1;

import "applicant/v1/applicant.proto";

option go_package = "github.com/mihaelaaa-23/pad-student-id-please/proto/gen/go/credential/v1;credentialv1";

// Same shape as the REST response of GET /credentials/{applicantId}.
message Credential {
  string applicant_id = 1;
  string student_id_card = 2;
  string university_email = 3;
  bool valid = 4;
  // Issue codes, see "Shared Enumerations" (Credential issues).
  repeated string issues = 5;
}

message IssueCredentialRequest {
  string applicant_id = 1;
  // Session always sends it, so Credential never has to look the applicant up.
  applicant.v1.ApplicantCore core = 2;
  optional string scenario = 3;
  optional int32 seed = 4;
}

message GetCredentialRequest {
  string applicant_id = 1;
}

message ValidateCredentialRequest {
  string applicant_id = 1;
}

message ValidationResult {
  string applicant_id = 1;
  bool valid = 2;
  repeated string issues = 3;
}

service CredentialService {
  // Session. ALREADY_EXISTS when the applicant already has a credential
  // (REST 409); the caller then uses GetCredential. REST: POST /credentials/{applicantId}.
  rpc IssueCredential(IssueCredentialRequest) returns (Credential);
  // Session, Moderation. NOT_FOUND when unknown. REST: GET /credentials/{applicantId}.
  rpc GetCredential(GetCredentialRequest) returns (Credential);
  // Moderation. REST: POST /credentials/{applicantId}/validate.
  rpc ValidateCredential(ValidateCredentialRequest) returns (ValidationResult);
}
